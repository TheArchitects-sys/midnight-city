<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none" stroke="#9CD5A7">
  <!-- Moldura de sinal do terminal (CRT Grid) -->
  <rect x="2" y="2" width="116" height="116" rx="4" stroke="#334B3A" stroke-width="1.5" stroke-dasharray="4 2" />
  
  <!-- Retículo de mira de frequência -->
  <circle cx="60" cy="60" r="46" stroke="#334B3A" stroke-width="1" />
  <circle cx="60" cy="60" r="30" stroke="#9CD5A7" stroke-width="0.8" opacity="0.4" />
  
  <!-- Linhas axiais do osciloscópio -->
  <line x1="60" y1="8" x2="60" y2="112" stroke="#334B3A" stroke-width="0.8" />
  <line x1="8" y1="60" x2="112" y2="60" stroke="#334B3A" stroke-width="0.8" />
  
  <!-- Silhueta da Presença Aprisionada (Fragmentos verticais confinados) -->
  <g class="presence-fragments" opacity="0.95">
    <!-- Cabeça / Núcleo Místico -->
    <path d="M50 32 C50 24, 70 24, 70 32 C70 42, 50 46, 50 58 H70" stroke="#9CD5A7" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="60" cy="74" r="3" fill="#9CD5A7" stroke="none" />
    
    <!-- Linhas de Confinamento Espectral -->
    <line x1="38" y1="24" x2="38" y2="96" stroke="#9CD5A7" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
    <line x1="44" y1="20" x2="44" y2="100" stroke="#9CD5A7" stroke-width="1.5" opacity="0.5" />
    <line x1="76" y1="20" x2="76" y2="100" stroke="#9CD5A7" stroke-width="1.5" opacity="0.5" />
    <line x1="82" y1="24" x2="82" y2="96" stroke="#9CD5A7" stroke-width="1.2" opacity="0.3" stroke-dasharray="3 3" />
    
    <!-- Pulso Central -->
    <path d="M25 60 H42 L47 48 L53 72 L58 54 L63 64 L68 60 H95" stroke="#9CD5A7" stroke-width="1.2" stroke-linejoin="round" opacity="0.75" />
  </g>
</svg>
